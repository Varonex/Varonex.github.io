<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Varonex's Github Pages</title>
    <link rel="stylesheet" href="css/style.css"/>
    <script src="js/app.js"></script>
</head>
<body>
    <header>
        <h1>Varonex</h1>
        <p class="subtitles">Personal Resources</p>
    </header>

    <main>
        <div class="grid" id="container">
            <a href="/portfolio" class="tile">
                <div>
                    <h2>Portfolio 👨‍💻</h2>
                    <p>Showcase of personal cybersecurity projects, labs, and development work.</p>
                </div>
                <div class="arrow">View Portfolio ➔</div>
            </a>

            <a href="/cyber-notes" class="tile">
                <div>
                    <h2>CyberNotes 🛡️</h2>
                    <p>Network cheatsheets, iptables rules, Linux administration, and security notes.</p>
                </div>
                <div class="arrow">Explore Notes ➔</div>
            </a>
        </div>
    </main>

    <footer>
        &copy; Varonex &bull; Hosted on GitHub Pages
    </footer>
</body>
</html>
